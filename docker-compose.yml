# Универсальный docker-compose.yml для dev и prod окружений
# Окружение определяется через переменные окружения:
# - APP_ENV=dev (по умолчанию) - порт 8080, MySQL порт 3307
# - APP_ENV=prod - порты 80 и 443, MySQL порт 3306

services:
  tyre-app-php:
    build:
      context: .
      dockerfile: Dockerfile
    image: tyre-app-php:latest
    container_name: tyre-app-php
    restart: always
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - tyre-app-files:/var/www/html/app/webroot/files
      - tyre-app-xls:/var/www/html/app/webroot/xls
      - tyre-app-ssl:/etc/apache2/ssl
      # .htaccess управляется скриптом init-domain-restriction.sh, не монтируем как volume
      # - ./app/webroot/.htaccess:/var/www/html/app/webroot/.htaccess
      - ./app/webroot/phpmy/config.inc.php:/var/www/html/app/webroot/phpmy/config.inc.php
      - ./app/webroot/phpmy/.htaccess:/var/www/html/app/webroot/phpmy/.htaccess
      - ./app/tmp:/var/www/html/app/tmp
      - ./app/Config:/var/www/html/app/Config
    environment:
      - DB_HOST=tyre-app-mysql
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-tyre_db}
      - DB_USER=${DB_USER:-tyre_user}
      - DB_PASSWORD=${DB_PASSWORD:-tyre_password}
      - PHPMYADMIN_USER=${PHPMYADMIN_USER:-admin}
      - PHPMYADMIN_PASSWORD=${PHPMYADMIN_PASSWORD:-admin_password}
      - APP_ENV=${APP_ENV:-dev}
      - ALLOWED_DOMAIN=${ALLOWED_DOMAIN:-}
    depends_on:
      - tyre-app-mysql
      - tyre-app-redis
    networks:
      - tyre-app-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Фоновая обработка импорта и конвертации прайсов (очередь import_jobs).
  # Отдельно от Apache и с ограничением ресурсов, чтобы тяжёлые задачи не тормозили сайт.
  tyre-app-worker:
    image: tyre-app-php:latest
    pull_policy: never
    container_name: tyre-app-worker
    restart: always
    user: www-data
    working_dir: /var/www/html/app
    # Одна задача на процесс PHP; цикл перезапускает воркер после каждой задачи
    command: ["sh", "-c", "while true; do nice -n 10 ionice -c2 -n7 php /var/www/html/lib/Cake/Console/cake.php -working /var/www/html/app import_worker --wait 300; sleep 1; done"]
    cpus: 1.0
    mem_limit: 768m
    volumes:
      - tyre-app-xls:/var/www/html/app/webroot/xls
      - ./app/tmp:/var/www/html/app/tmp
      - ./app/Config:/var/www/html/app/Config
    environment:
      - DB_HOST=tyre-app-mysql
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-tyre_db}
      - DB_USER=${DB_USER:-tyre_user}
      - DB_PASSWORD=${DB_PASSWORD:-tyre_password}
      - APP_ENV=${APP_ENV:-dev}
      - IMPORT_THROTTLE_MS=${IMPORT_THROTTLE_MS:-50}
    depends_on:
      - tyre-app-mysql
      - tyre-app-redis
    networks:
      - tyre-app-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  tyre-app-redis:
    image: redis:5-alpine
    container_name: tyre-app-redis
    restart: always
    volumes:
      - tyre-app-redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - tyre-app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  tyre-app-mysql:
    image: mysql:5.7
    platform: linux/amd64
    container_name: tyre-app-mysql
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root_password}
      - MYSQL_DATABASE=${DB_NAME:-tyre_db}
      - MYSQL_USER=${DB_USER:-tyre_user}
      - MYSQL_PASSWORD=${DB_PASSWORD:-tyre_password}
    volumes:
      - tyre-app-mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
      - ./dumps:/dumps
    command: --sql-mode="NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_AUTO_CREATE_USER,NO_ENGINE_SUBSTITUTION" --character-set-server=utf8 --collation-server=utf8_general_ci --innodb-buffer-pool-size=1024M --max-connections=100 --query-cache-size=128M --query-cache-type=1 --query-cache-limit=2M --innodb-flush-log-at-trx-commit=2 --innodb-log-file-size=256M --innodb-thread-concurrency=0 --innodb-read-io-threads=4 --innodb-write-io-threads=4 --table-open-cache=4000 --thread-cache-size=50 --innodb-lock-wait-timeout=10 --innodb-buffer-pool-instances=4 --innodb-io-capacity=2000 --innodb-purge-threads=2 --innodb-flush-method=O_DIRECT --innodb-adaptive-hash-index=0
    networks:
      - tyre-app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_password}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  tyre-app-mysql-data:
    driver: local
  tyre-app-files:
    driver: local
  tyre-app-xls:
    driver: local
  tyre-app-ssl:
    driver: local
  tyre-app-redis-data:
    driver: local

networks:
  tyre-app-network:
    driver: bridge
